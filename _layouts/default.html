<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  {{alternateLinks}}
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{imageUrl}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/global.css">
  <script src="assets/js/main.js" defer></script>
  <script type="application/ld+json">{{schema}}</script>
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>
  {{icons}}
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="#about" aria-label="Wenzhan Li, home"><span class="monogram">w<span>l</span><i>.</i></span><span class="brand-name">Wenzhan Li</span></a>
      <nav class="main-nav" id="main-nav" aria-label="{{navigationLabel}}">
        <a href="#about" class="active">{{about}}</a><a href="#publications">{{researchNav}}</a><a href="#experience">{{experienceNav}}</a><a href="#contact">{{contactNav}}</a>
        <a class="nav-cv" href="{{cv}}" title="{{cvDate}}" target="_blank" rel="noopener">{{cvNav}} {{arrow}}</a>
      </nav>
      <div class="nav-tools"><a class="language-switch" data-language data-base="{{languageHref}}" href="{{languageHref}}" hreflang="{{otherLang}}" aria-label="{{languageLabel}}">{{language}}</a><button class="theme-toggle" id="theme-toggle" aria-label="{{themeToDark}}" title="{{themeToDark}}">{{themeIcon}}</button><button class="menu-toggle" id="menu-toggle" aria-label="{{openMenu}}" aria-expanded="false" aria-controls="main-nav"><span></span><span></span></button></div>
    </div>
    <div class="reading-progress" aria-hidden="true"></div>
  </header>
  <main id="main">{{main}}</main>
  <footer class="site-footer wrap"><div><span class="footer-mark">Wenzhan Li</span><span>{{footer}}</span></div><div><span>{{updatedPrefix}} {{updated}}</span><a href="https://github.com/li-wenzhan/li-wenzhan.github.io" target="_blank" rel="noopener">{{source}} {{arrow}}</a><a href="#about" class="back-top">{{backTop}}</a></div></footer>
  {{dialog}}
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
